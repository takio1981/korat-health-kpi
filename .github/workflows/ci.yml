# ทดสอบอัตโนมัติทุกครั้งที่ push / เปิด Pull Request — ต้องผ่านทั้ง 2 งานก่อน deploy (build.bat)
#   api      : Jest + supertest บนฐานข้อมูล MariaDB 10.11 ที่สร้างใหม่จาก api/tests/ci/schema.sql + seed.sql
#   frontend : Vitest (ng test) + ng build แบบ production
# ไม่มีการ deploy และไม่ใช้ secret ใดๆ — ฐานข้อมูลเป็น container ชั่วคราวของ runner เท่านั้น
name: CI

on:
  push:
    branches: [main]
  pull_request:

# push ซ้อนกันในกิ่งเดียวกัน → ยกเลิกรอบเก่าที่ยังรันอยู่
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API tests (Jest + MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_root_pw
          MARIADB_DATABASE: khups_kpi_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # ชื่อฐานข้อมูลต้องมีคำว่า "test" — api/tests/setup.js ปฏิเสธการรันถ้าไม่ใช่ (ชุดทดสอบลบข้อมูล)
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_root_pw
      DB_NAME: khups_kpi_test_db
      SECRET_KEY: ci-test-secret-not-used-anywhere-else
      NODE_ENV: test
      TZ: Asia/Bangkok
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Create test database (schema + minimal reference data)
        run: node tests/ci/load-ci-db.js
      - name: Run API tests
        run: npm test

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Bangkok
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --legacy-peer-deps: package-lock ปัจจุบันมี @angular/animations 21.2 คู่กับ @angular/core 21.1 (peer ไม่ตรง)
      # ติดตั้งแบบเดียวกับเครื่องพัฒนา — ถ้าปรับรุ่น Angular ให้ตรงกันแล้วให้เอา flag นี้ออก
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build --base-href /khupskpi/
